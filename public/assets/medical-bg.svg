<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark luxury clinical gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="35%" stop-color="#08142c" />
      <stop offset="70%" stop-color="#0a1835" />
      <stop offset="100%" stop-color="#030710" />
    </linearGradient>

    <!-- Radial ambient glows -->
    <radialGradient id="glow-top" cx="50%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#263F91" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#152B56" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#08142c" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-bottom" cx="20%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Medical Bokeh Filter -->
    <filter id="bokeh-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Luminous Ambient Glows -->
  <rect width="1920" height="1080" fill="url(#glow-top)" />
  <rect width="1920" height="1080" fill="url(#glow-cyan)" />
  <rect width="1920" height="1080" fill="url(#glow-bottom)" />

  <!-- Abstract Clinical Architecture & Glass Reflections -->
  <g opacity="0.12" stroke="#60A5FA" stroke-width="1.5">
    <!-- Modern ICU Glass Partitions -->
    <line x1="200" y1="0" x2="600" y2="1080" stroke-dasharray="8 8" />
    <line x1="1720" y1="0" x2="1320" y2="1080" stroke-dasharray="8 8" />
    <line x1="0" y1="380" x2="1920" y2="380" stroke-opacity="0.5" />
    <line x1="0" y1="720" x2="1920" y2="720" stroke-opacity="0.3" />
  </g>

  <!-- Bokeh Orbs (Medical Light Reflections) -->
  <g filter="url(#bokeh-blur)">
    <circle cx="960" cy="180" r="280" fill="#2563EB" opacity="0.35" />
    <circle cx="450" cy="400" r="220" fill="#0EA5E9" opacity="0.2" />
    <circle cx="1500" cy="550" r="260" fill="#4F46E5" opacity="0.25" />
    <circle cx="800" cy="850" r="320" fill="#1D4ED8" opacity="0.2" />
    <circle cx="1300" cy="200" r="160" fill="#38BDF8" opacity="0.25" />
    <circle cx="250" cy="750" r="180" fill="#0284C7" opacity="0.25" />
  </g>

  <!-- Subtle Medical Grid Nodes -->
  <g opacity="0.08" fill="#FFFFFF">
    <circle cx="300" cy="200" r="3" />
    <circle cx="600" cy="200" r="3" />
    <circle cx="900" cy="200" r="3" />
    <circle cx="1200" cy="200" r="3" />
    <circle cx="1500" cy="200" r="3" />

    <circle cx="300" cy="500" r="3" />
    <circle cx="600" cy="500" r="3" />
    <circle cx="900" cy="500" r="3" />
    <circle cx="1200" cy="500" r="3" />
    <circle cx="1500" cy="500" r="3" />

    <circle cx="300" cy="800" r="3" />
    <circle cx="600" cy="800" r="3" />
    <circle cx="900" cy="800" r="3" />
    <circle cx="1200" cy="800" r="3" />
    <circle cx="1500" cy="800" r="3" />
  </g>

  <!-- Cardiac Rhythm / ECG Pulse Line in lower backdrop -->
  <g opacity="0.18">
    <path d="M0 680 H500 L540 680 L560 630 L590 730 L620 650 L640 690 L670 680 H1200 L1240 680 L1260 620 L1290 740 L1320 640 L1340 690 L1370 680 H1920" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Stylized Pulmonary Lung Vector Motif in background -->
  <g transform="translate(960, 480)" opacity="0.04" stroke="#FFFFFF" stroke-width="2" fill="none">
    <!-- Left Lung -->
    <path d="M-40 -120 C-120 -100 -180 0 -160 120 C-140 220 -80 250 -40 240 C-20 230 -20 180 -20 100 Z" />
    <!-- Right Lung -->
    <path d="M40 -120 C120 -100 180 0 160 120 C140 220 80 250 40 240 C20 230 20 180 20 100 Z" />
    <!-- Trachea / Bronchi -->
    <path d="M0 -180 V-100 L-30 -50 M0 -100 L30 -50" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Vignette overlay to darken edges and make central phone card pop -->
  <rect width="1920" height="1080" fill="none" stroke="#020617" stroke-width="120" opacity="0.6" />
</svg>

