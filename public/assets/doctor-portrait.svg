<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF0FA" />
      <stop offset="50%" stop-color="#F5F8FC" />
      <stop offset="100%" stop-color="#DCE7F8" />
    </linearGradient>
    <linearGradient id="coat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="navy-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#263F91" />
      <stop offset="100%" stop-color="#152B56" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#152B56" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="1000" rx="32" fill="url(#bg-grad)" />

  <!-- Medical Grid Pattern in background -->
  <g opacity="0.15">
    <circle cx="100" cy="150" r="3" fill="#263F91" />
    <circle cx="200" cy="150" r="3" fill="#263F91" />
    <circle cx="300" cy="150" r="3" fill="#263F91" />
    <circle cx="400" cy="150" r="3" fill="#263F91" />
    <circle cx="500" cy="150" r="3" fill="#263F91" />
    <circle cx="600" cy="150" r="3" fill="#263F91" />
    <circle cx="700" cy="150" r="3" fill="#263F91" />
    
    <circle cx="100" cy="250" r="3" fill="#263F91" />
    <circle cx="200" cy="250" r="3" fill="#263F91" />
    <circle cx="300" cy="250" r="3" fill="#263F91" />
    <circle cx="400" cy="250" r="3" fill="#263F91" />
    <circle cx="500" cy="250" r="3" fill="#263F91" />
    <circle cx="600" cy="250" r="3" fill="#263F91" />
    <circle cx="700" cy="250" r="3" fill="#263F91" />

    <!-- Pulse Wave Background Accent -->
    <path d="M50 400 H250 L280 340 L320 460 L360 380 L390 420 L420 400 H750" fill="none" stroke="#263F91" stroke-width="2.5" stroke-dasharray="6 6" />
  </g>

  <!-- Doctor Silhouette / Medical Illustration -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Clinical White Coat -->
    <path d="M180 960 C180 720, 240 620, 400 620 C560 620, 620 720, 620 960 Z" fill="url(#coat-grad)" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Scrub Suit / Inner Shirt -->
    <path d="M340 620 L400 780 L460 620 Z" fill="#263F91" />
    <path d="M355 620 L400 730 L445 620 Z" fill="#1E3A8A" />

    <!-- Coat Lapels -->
    <path d="M260 630 L350 780 L320 960 L200 960 Z" fill="#F8FAFC" />
    <path d="M540 630 L450 780 L480 960 L600 960 Z" fill="#F1F5F9" />

    <!-- Stethoscope -->
    <path d="M330 630 C330 730, 350 820, 400 850 C450 820, 470 730, 470 630" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
    <path d="M400 850 L400 890" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round" />
    <circle cx="400" cy="915" r="25" fill="#94A3B8" stroke="#475569" stroke-width="4" />
    <circle cx="400" cy="915" r="14" fill="#CBD5E1" />

    <!-- Neck -->
    <rect x="360" y="470" width="80" height="90" rx="20" fill="#E2B194" />

    <!-- Head / Face -->
    <ellipse cx="400" cy="380" rx="100" ry="125" fill="#EBB99D" />
    
    <!-- Hair -->
    <path d="M295 360 C295 240, 505 240, 505 360 C505 280, 470 230, 400 230 C330 230, 295 280, 295 360 Z" fill="#2D2424" />

    <!-- Eyeglasses (Professional Doctor Style) -->
    <rect x="330" y="345" width="55" height="38" rx="8" fill="none" stroke="#1E293B" stroke-width="4.5" />
    <rect x="415" y="345" width="55" height="38" rx="8" fill="none" stroke="#1E293B" stroke-width="4.5" />
    <path d="M385 360 H415" stroke="#1E293B" stroke-width="4" />

    <!-- Eyes & Smile -->
    <circle cx="357" cy="364" r="5" fill="#1E293B" />
    <circle cx="442" cy="364" r="5" fill="#1E293B" />
    <path d="M375 425 Q400 445 425 425" fill="none" stroke="#A1624B" stroke-width="3.5" stroke-linecap="round" />

    <!-- Hospital Identification Badge -->
    <g transform="translate(260, 780)">
      <rect x="0" y="0" width="90" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="0" y="0" width="90" height="22" rx="8" fill="#263F91" />
      <circle cx="45" cy="48" r="16" fill="#E2E8F0" />
      <rect x="15" y="72" width="60" height="5" rx="2" fill="#263F91" />
      <rect x="22" y="82" width="46" height="4" rx="2" fill="#94A3B8" />
      <rect x="30" y="92" width="30" height="4" rx="2" fill="#DC2626" />
    </g>
  </g>

  <!-- Overlay Glassmorphism Tag -->
  <g transform="translate(60, 840)">
    <rect x="0" y="0" width="360" height="96" rx="20" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="48" cy="48" r="26" fill="#EAF0FA" />
    <path d="M48 34V62M34 48H62" stroke="#263F91" stroke-width="4" stroke-linecap="round" />
    <text x="88" y="42" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#152B56">Dr. Avinash Kasundra</text>
    <text x="88" y="62" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#263F91">Consultant Pulmonologist &amp; Intensivist</text>
    <text x="88" y="78" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#64748B">Lilavati Hospital Fellow • Premier ICU</text>
  </g>
</svg>

