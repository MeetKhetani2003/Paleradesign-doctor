<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none" width="100%" height="100%">
  <!-- Icon Emblem -->
  <g transform="translate(4, 8)">
    <!-- Outer Shield / Clinical Hexagon -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#263F91" />
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#blue-grad)" />
    <!-- Medical Cross with Pulse -->
    <path d="M32 16V48M16 32H48" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="7" fill="#263F91" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M22 32H27L30 25L34 39L37 32H42" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Typography -->
  <text x="82" y="38" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#152B56" letter-spacing="1.2">PREMIER</text>
  <text x="210" y="38" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="25" font-weight="600" fill="#263F91" letter-spacing="1.2">HOSPITAL</text>
  <rect x="345" y="19" width="62" height="23" rx="5" fill="#DC2626" />
  <text x="376" y="35" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">&amp; ICU</text>
  <text x="83" y="58" font-family="'Poppins', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#526BB5" letter-spacing="1.8">ADVANCED PULMONARY &amp; CRITICAL CARE • RAJKOT</text>
  <defs>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#263F91" />
      <stop offset="100%" stop-color="#152B56" />
    </linearGradient>
  </defs>
</svg>

